# Adobe SDFS (Simple Distributed File System) Configuration
# Simulating Adobe's internal distributed file system

storage:
  dbPath: /data/db

systemLog:
  destination: file
  path: /var/log/mongodb/sdfs.log
  logAppend: true

net:
  port: 27017
  bindIp: 0.0.0.0

# Adobe SDFS specific settings
setParameter:
  enableLocalhostAuthBypass: true
